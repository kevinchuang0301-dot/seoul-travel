</style></head><body>
<nav class="desktop-site-nav" aria-label="網站主要導覽"><div class="inner"><a class="site-brand" href="./">SEOUL <span>TRIP 2027</span></a><div class="site-links"><a href="./" class="active" aria-current="page">行事曆</a><a href="./attractions.html">景點介紹</a></div></div></nav>
<header class="page-hero"><div class="eyebrow">SEOUL TRIP · 2027</div><h1>2027 春節旅遊行事曆</h1><p>1/31～2/13 · 兩週行程規劃</p></header>
<main>
<div id="config-notice" class="notice"><strong>多人同步尚未啟用</strong><div class="hint">行事曆已建立。請先設定 Firebase 專案與 Firestore 規則才能多人共用；設定前無法儲存。啟用免登入共用後，任何取得網址的人都可能閱讀或修改行程，請勿填入個資或訂位編號。</div></div>
<div class="toolbar"><div><strong>行程事項</strong><div class="status" id="sync-status" role="status">等待雲端設定</div></div><div class="legend"><span class="hint">兩週共 14 天 · 星期日開始 · 初始無事項</span><button id="refresh" type="button">重新整理</button></div></div>
<div class="calendar-wrap"><div class="calendar" id="calendar" aria-label="2027 年一月三十一日至二月十三日旅遊行事曆"></div></div>
<div class="mobile-calendar" id="mobile-calendar">
	<section class="mobile-overview" aria-label="選擇行程日期">
		<div class="mobile-overview-header"><h2>兩週日期總覽</h2><div class="mobile-refresh-row"><button type="button" class="mobile-refresh" id="mobile-refresh">↻ 重新整理</button></div></div>
		<div class="mobile-weekdays" aria-hidden="true"><span class="weekend">日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span class="weekend">六</span></div>
		<div class="mobile-days" id="mobile-days"></div>
	</section>
	<section class="mobile-detail" aria-live="polite">
		<div class="mobile-detail-header"><h2 id="mobile-date-heading"></h2><button type="button" class="mobile-add" id="mobile-add">＋ 新增事項</button></div>
		<div id="mobile-events"></div>
	</section>
</div>
<section class="editor hide" id="editor"><h2 id="editor-title">新增事項</h2><form id="event-form"><div class="fields"><label>日期（固定）<input id="date-display" type="text" readonly aria-label="所選日期，不可修改"><select id="date" class="hide" tabindex="-1" aria-hidden="true"></select></label><label>時間安排<select id="time-mode"><option value="flex">全天／彈性安排（不指定時間）</option><option value="fixed">指定時間</option></select></label><label id="time-field" class="hide">開始時間<input type="time" id="time"></label><label class="full">事項名稱<input id="title" maxlength="120" required placeholder="例如：集合、用餐、活動"></label><label class="full">備註（選填）<textarea id="notes" rows="3" maxlength="1000"></textarea></label></div><div class="actions"><button class="primary" id="save" type="submit">儲存到共用行事曆</button><button id="cancel" type="button">取消</button><button class="danger hide" id="delete" type="button">刪除事項</button></div></form></section>

</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {getFirestore,collection,onSnapshot,addDoc,updateDoc,deleteDoc,doc,serverTimestamp,query,orderBy} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const dates=Array.from({length:14},(_,i)=>{const d=new Date(2027,0,31+i);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")});
const weekdays=["日","一","二","三","四","五","六"];
const lunar={"2027-02-04":"小年夜","2027-02-05":"除夕","2027-02-06":"初一","2027-02-07":"初二","2027-02-08":"初三","2027-02-09":"初四","2027-02-10":"初五","2027-02-11":"開工"};
const names=dates.map(date=>{const [y,m,d]=date.split("-").map(Number);const label=m+"/"+d+"（"+weekdays[new Date(y,m-1,d).getDay()]+"）";return label+(lunar[date]?" "+lunar[date]:"")});
const el=id=>document.getElementById(id),calendar=el("calendar"),editor=el("editor");
const dateInput=el("date");for(let i=0;i<dates.length;i++){let opt=document.createElement("option");opt.value=dates[i];opt.textContent=names[i];dateInput.append(opt);}
let items=[],db=null,enabled=false,selectedId=null,unsubscribe=null,activeDate="2027-02-03";
function render(){calendar.replaceChildren();dates.forEach((date,i)=>{const day=document.createElement("section");day.className="day";const head=document.createElement("div");head.className="day-head"+((i%7===0||i%7===6||lunar[date])?" holiday":"");head.textContent=names[i];const list=document.createElement("div");list.className="day-items";items.filter(e=>e.date===date).sort((a,b)=>(a.time||"").localeCompare(b.time||"")).forEach(e=>{const btn=document.createElement("button");btn.type="button";btn.className="event";const strong=document.createElement("strong");strong.textContent=(e.time?e.time+" ":"")+e.title;btn.append(strong);if(e.notes){const note=document.createElement("small");note.textContent=e.notes;btn.append(note)}btn.addEventListener("click",()=>openEditor(date,e));list.append(btn)});const add=document.createElement("button");add.type="button";add.className="add";add.textContent="＋ 新增事項";add.disabled=!enabled;add.addEventListener("click",()=>openEditor(date));list.append(add);day.append(head,list);calendar.append(day)});renderMobile()}

function renderMobile(){
	const daysEl=el("mobile-days");
	const eventsEl=el("mobile-events");
	daysEl.replaceChildren();
	eventsEl.replaceChildren();
	dates.forEach((date,i)=>{
		const button=document.createElement("button");
		button.type="button";
		button.className=(i%7===0||i%7===6||lunar[date]?"weekend ":"")+(date===activeDate?"selected":"");
		const num=document.createElement("span");
		num.textContent=String(Number(date.slice(-2)));
		const dot=document.createElement("span");
		dot.className="dot"+(items.some(item=>item.date===date)?"":" empty");
		button.append(num,dot);
		button.setAttribute("aria-label",names[i]+(items.some(item=>item.date===date)?"，有行程":"，無行程"));
		button.setAttribute("aria-pressed",String(date===activeDate));
		button.addEventListener("click",()=>{activeDate=date;renderMobile()});
		daysEl.append(button);
	});
	const dayIndex=dates.indexOf(activeDate);
	el("mobile-date-heading").textContent=names[dayIndex]||"";
	const todayItems=items.filter(e=>e.date===activeDate).sort((a,b)=>(a.time||"").localeCompare(b.time||""));


	if(!todayItems.length){
		const empty=document.createElement("div");
		empty.className="empty-note";
		empty.textContent="尚未安排事項";
		eventsEl.append(empty);
	}else{
		const flexible=todayItems.filter(e=>!e.time);
		const scheduled=todayItems.filter(e=>!!e.time);
		const heading=(label)=>{
			const h=document.createElement("h3");
			h.className="mobile-group-heading";
			h.textContent=label;
			return h;
		};
		const eventCard=(e,cls)=>{
			const card=document.createElement("button");
			card.type="button";
			card.className=cls;
			const title=document.createElement("strong");
			title.textContent=e.title;
			card.append(title);
			if(e.notes){
				const note=document.createElement("span");
				note.className="event-notes";
				note.textContent=e.notes;
				card.append(note);
			}
			card.addEventListener("click",()=>openEditor(activeDate,e));
			return card;
		};
		if(flexible.length){
			const section=document.createElement("section");
			section.className="mobile-flex-section";
			section.append(heading("☀ 全天／彈性安排"));
			const list=document.createElement("div");
			list.className="mobile-flex-list";
			flexible.forEach(e=>list.append(eventCard(e,"flex-card")));
			section.append(list);
			eventsEl.append(section);
		}
		if(scheduled.length){
			const section=document.createElement("section");
			section.className="mobile-scheduled-section";
			section.append(heading("◷ 固定時間行程"));
			const timeline=document.createElement("div");
			timeline.className="mobile-timeline";
			scheduled.forEach(e=>{
				const row=document.createElement("div");
				row.className="timeline-row";
				const time=document.createElement("div");
				time.className="timeline-time";
				time.textContent=e.time;
				row.append(time,eventCard(e,"timeline-card"));
				timeline.append(row);
			});
			section.append(timeline);
			eventsEl.append(section);
		}
	}
	const add=el("mobile-add");
	add.disabled=!enabled;
	add.textContent="＋ 新增事項";
}
el("mobile-add").addEventListener("click",()=>openEditor(activeDate));
function openEditor(date,e=null){if(!enabled||!dates.includes(date))return;selectedId=e?.id||null;dateInput.value=date;el("date-display").value=names[dates.indexOf(date)]||date;el("time-mode").value=e?.time?"fixed":"flex";el("time").value=e?.time||"";syncTimeMode();el("title").value=e?.title||"";el("notes").value=e?.notes||"";el("editor-title").textContent=e?"編輯事項":"新增事項";el("delete").classList.toggle("hide",!e);editor.classList.remove("hide");editor.scrollIntoView({behavior:"smooth",block:"nearest"})}
function syncTimeMode(){
	const fixed=el("time-mode").value==="fixed";
	el("time-field").classList.toggle("hide",!fixed);
	el("time").required=fixed;
	if(!fixed)el("time").value="";
}
el("time-mode").addEventListener("change",syncTimeMode);
function closeEditor(){editor.classList.add("hide");selectedId=null;el("event-form").reset()}
el("cancel").addEventListener("click",closeEditor);
el("refresh").addEventListener("click",()=>location.reload());
el("mobile-refresh").addEventListener("click",()=>location.reload());
function status(s){el("sync-status").textContent=s}
function errorText(e){status("操作失敗："+(e?.message||String(e)))}
async function boot(){
const config=window.SEOUL_FIREBASE_CONFIG;
if(!config?.apiKey||!config?.projectId){render();return}
try{const app=initializeApp(config);db=getFirestore(app);el("config-notice").classList.add("hide");status("雲端連線中…");
unsubscribe=onSnapshot(query(collection(db,"shared-itinerary-2027"),orderBy("date")),snapshot=>{items=snapshot.docs.map(d=>({id:d.id,...d.data()})).filter(e=>dates.includes(e.date));enabled=true;status("已同步，免登入即可新增、修改及刪除");render()},errorText);
}catch(e){errorText(e)}
}
el("event-form").addEventListener("submit",async ev=>{ev.preventDefault();if(!enabled||!db)return;const payload={date:dateInput.value,time:el("time-mode").value==="fixed"?el("time").value:"",title:el("title").value.trim(),notes:el("notes").value.trim(),updatedAt:serverTimestamp()};if(!dates.includes(payload.date)||!payload.title)return;el("save").disabled=true;try{if(selectedId)await updateDoc(doc(db,"shared-itinerary-2027",selectedId),payload);else await addDoc(collection(db,"shared-itinerary-2027"),payload);closeEditor();status("已儲存，其他人將同步看到變更")}catch(e){errorText(e)}finally{el("save").disabled=false}});
el("delete").addEventListener("click",async()=>{if(!selectedId||!enabled||!confirm("確定刪除這個共同行程？"))return;try{await deleteDoc(doc(db,"shared-itinerary-2027",selectedId));closeEditor()}catch(e){errorText(e)}});
render();boot();
</script>
