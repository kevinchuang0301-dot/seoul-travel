<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {getFirestore,collection,onSnapshot,addDoc,updateDoc,deleteDoc,doc,serverTimestamp,query,orderBy} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const dates=Array.from({length:14},(_,i)=>{const d=new Date(2027,0,31+i);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")});
const weekdays=["日","一","二","三","四","五","六"];
const categoryIcons={flight:"✈️",transport:"🚗",meal:"🍚",hotel:"🏠",other:"📌"};
const categoryIcon=value=>categoryIcons[value]||categoryIcons.other;
// Store the category as a visible title prefix to retain the existing Firestore schema.
const categoryFromTitle=title=>{
	const prefix=String(title||"").match(/^(✈️|🚗|🍚|🏠|📌)\s+/u);
	return prefix?Object.keys(categoryIcons).find(key=>categoryIcons[key]===prefix[1])||"other":null;
};
const plainEventTitle=title=>String(title||"").replace(/^(?:✈️|🚗|🍚|🏠|📌)\s+/u,"");
const eventCategory=event=>categoryFromTitle(event.title)||event.category||"other";
const displayEventTitle=event=>categoryIcon(eventCategory(event))+" "+plainEventTitle(event.title);
const categoryOrder={flight:0,transport:1,meal:2,hotel:3,other:4};
function compareItineraryItems(a,b){
	const aTime=a.time||"";
	const bTime=b.time||"";
	if(!aTime&&!bTime){
		return (categoryOrder[eventCategory(a)]??4)-(categoryOrder[eventCategory(b)]??4);
	}
	if(!aTime)return -1;
	if(!bTime)return 1;
	return aTime.localeCompare(bTime);
}
const lunar={"2027-02-04":"小年夜","2027-02-05":"除夕","2027-02-06":"初一","2027-02-07":"初二","2027-02-08":"初三","2027-02-09":"初四","2027-02-10":"初五","2027-02-11":"開工"};
const isHoliday=(date,dayIndex)=>dayIndex%7===0||dayIndex%7===6||(date>="2027-02-04"&&date<="2027-02-10");
const names=dates.map(date=>{const [y,m,d]=date.split("-").map(Number);const label=m+"/"+d+"（"+weekdays[new Date(y,m-1,d).getDay()]+"）";return label+(lunar[date]?" "+lunar[date]:"")});
const el=id=>document.getElementById(id),calendar=el("calendar"),editor=el("editor");
const dateInput=el("date");for(let i=0;i<dates.length;i++){let opt=document.createElement("option");opt.value=dates[i];opt.textContent=names[i];dateInput.append(opt);}
// Use the visitor's local calendar date, not UTC, for the initial mobile selection.
function initialMobileDate(){
	const now=new Date();
	const localDate=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
	return dates.includes(localDate)?localDate:"2027-02-01";
}
const LOCAL_ITINERARY_KEY="seoul-trip-2027-last-synced-v1";
function loadSavedItinerary(){
	try{
		const data=JSON.parse(localStorage.getItem(LOCAL_ITINERARY_KEY)||"null");
		if(data&&Array.isArray(data.items)){
			return data.items.filter(e=>e&&dates.includes(e.date)&&typeof e.title==="string");
		}
	}catch(e){console.warn("離線行程資料無法讀取",e)}
	return [];
}
function saveItineraryLocally(){
	try{
		localStorage.setItem(LOCAL_ITINERARY_KEY,JSON.stringify({
			savedAt:new Date().toISOString(),
			items:items.map(e=>({id:e.id,date:e.date,time:e.time||"",title:e.title,notes:e.notes||""}))
		}));
	}catch(e){console.warn("無法將行程儲存至本機",e)}
}
let items=loadSavedItinerary(),db=null,enabled=false,selectedId=null,unsubscribe=null,activeDate=initialMobileDate();
let serverAvailable=false;
function updateConnectionUI(){
	const online=navigator.onLine&&serverAvailable;
	enabled=Boolean(online);
	const offline=!navigator.onLine;
	const notice=el("offline-notice");
	notice.classList.toggle("hide",online);
	notice.textContent=offline
		?"📴 離線唯讀 · 顯示最後一次同步的行程，恢復連線後才能編輯"
		:"☁ 尚未連上雲端 · 暫時唯讀，連線成功後才能編輯";
	if(!online){
		status(offline
			?(items.length?"離線唯讀 · 顯示本機最後同步的行程":"離線唯讀 · 尚無已儲存的行程，請先連線同步")
			:(items.length?"等待雲端連線 · 目前顯示本機已存行程":"等待雲端連線…"));
		if(!editor.classList.contains("hide"))closeEditor();
	}else{
		status("已同步，免登入即可新增、修改及刪除");
	}
	render();
}
window.addEventListener("offline",()=>{serverAvailable=false;updateConnectionUI()});
window.addEventListener("online",()=>{serverAvailable=false;updateConnectionUI()});
function render(){calendar.replaceChildren();dates.forEach((date,i)=>{const day=document.createElement("section");day.className="day";const head=document.createElement("div");head.className="day-head"+((isHoliday(date,i))?" holiday":"");head.textContent=names[i];const list=document.createElement("div");list.className="day-items";items.filter(e=>e.date===date).sort(compareItineraryItems).forEach(e=>{const btn=document.createElement("button");btn.type="button";btn.className="event";const strong=document.createElement("strong");strong.textContent=displayEventTitle(e);btn.append(strong);if(e.time){const time=document.createElement("span");time.className="event-time";time.textContent=e.time;btn.append(time)}if(e.notes){const note=document.createElement("small");note.textContent=e.notes;btn.append(note)}btn.addEventListener("click",()=>openEditor(date,e));list.append(btn)});const add=document.createElement("button");add.type="button";add.className="add";add.textContent="＋ 新增事項";add.disabled=!enabled;add.addEventListener("click",()=>openEditor(date));list.append(add);day.append(head,list);calendar.append(day)});renderMobile()}

function renderMobile(){
	const daysEl=el("mobile-days");
	const eventsEl=el("mobile-events");
	daysEl.replaceChildren();
	eventsEl.replaceChildren();
	dates.forEach((date,i)=>{
		const button=document.createElement("button");
		button.type="button";
		button.className=(isHoliday(date,i)?"weekend ":"")+(date===activeDate?"selected":"");
		const num=document.createElement("span");
		num.textContent=String(Number(date.slice(-2)));
		const dot=document.createElement("span");
		dot.className="dot"+(items.some(item=>item.date===date)?"":" empty");
		button.append(num,dot);
		button.setAttribute("aria-label",names[i]+(items.some(item=>item.date===date)?"，有行程":"，無行程"));
		button.setAttribute("aria-pressed",String(date===activeDate));
		button.addEventListener("click",()=>{activeDate=date;renderMobile()});
		daysEl.append(button);
	});
	const dayIndex=dates.indexOf(activeDate);
	el("mobile-date-heading").textContent=names[dayIndex]||"";
	const todayItems=items.filter(e=>e.date===activeDate).sort(compareItineraryItems);


	if(!todayItems.length){
		const empty=document.createElement("div");
		empty.className="empty-note";
		empty.textContent="尚未安排事項";
		eventsEl.append(empty);
	}else{
		const flexible=todayItems.filter(e=>!e.time);
		const scheduled=todayItems.filter(e=>!!e.time);
		const heading=(label)=>{
			const h=document.createElement("h3");
			h.className="mobile-group-heading";
			h.textContent=label;
			return h;
		};
		const eventCard=(e,cls)=>{
			const card=document.createElement("button");
			card.type="button";
			card.className=cls;
			const title=document.createElement("strong");
			title.textContent=displayEventTitle(e);
			card.append(title);
			if(e.notes){
				const note=document.createElement("span");
				note.className="event-notes";
				note.textContent=e.notes;
				card.append(note);
			}
			card.addEventListener("click",()=>openEditor(activeDate,e));
			return card;
		};
		if(flexible.length){
			const section=document.createElement("section");
			section.className="mobile-flex-section";
			section.append(heading("☀ 全天／彈性安排"));
			const list=document.createElement("div");
			list.className="mobile-flex-list";
			flexible.forEach(e=>list.append(eventCard(e,"flex-card")));
			section.append(list);
			eventsEl.append(section);
		}
		if(scheduled.length){
			const section=document.createElement("section");
			section.className="mobile-scheduled-section";
			section.append(heading("◷ 固定時間行程"));
			const timeline=document.createElement("div");
			timeline.className="mobile-timeline";
			scheduled.forEach(e=>{
				const row=document.createElement("div");
				row.className="timeline-row";
				const time=document.createElement("div");
				time.className="timeline-time";
				time.textContent=e.time;
				row.append(time,eventCard(e,"timeline-card"));
				timeline.append(row);
			});
			section.append(timeline);
			eventsEl.append(section);
		}
	}
	const add=el("mobile-add");
	add.disabled=!enabled;
	add.textContent="＋ 新增事項";
}
el("mobile-add").addEventListener("click",()=>openEditor(activeDate));
function openEditor(date,e=null){if(!enabled||!navigator.onLine||!dates.includes(date))return;clearFormFeedback();selectedId=e?.id||null;el("category-options").querySelector(`input[value="${e?eventCategory(e):"other"}"]`).checked=true;dateInput.value=date;el("date-display").value=names[dates.indexOf(date)]||date;el("time-mode").value=e?.time?"fixed":"flex";el("time").value=e?.time||"";syncTimeMode();el("title").value=e?plainEventTitle(e.title):"";el("notes").value=e?.notes||"";el("editor-title").textContent=e?"編輯事項":"新增事項";el("delete").classList.toggle("hide",!e);editor.classList.remove("hide");editor.scrollIntoView({behavior:"smooth",block:"nearest"})}
function syncTimeMode(){
	const fixed=el("time-mode").value==="fixed";
	el("time-field").classList.toggle("hide",!fixed);
	el("time").required=fixed;
	if(!fixed)el("time").value="";
}
el("time-mode").addEventListener("change",syncTimeMode);
function clearFormFeedback(){
	const feedback=el("form-feedback");
	feedback.textContent="";
	feedback.dataset.kind="";
	feedback.classList.add("hide");
}
function showFormFeedback(message,kind="error"){
	const feedback=el("form-feedback");
	feedback.textContent=message;
	feedback.dataset.kind=kind;
	feedback.classList.remove("hide");
}
function saveErrorMessage(error){
	const code=String(error?.code||"");
	if(code.includes("permission-denied")){
		return "雲端拒絕儲存。若是 1/31～2/2 的行程，請先確認 Firebase Firestore 規則已將可編輯起始日期改成 2027-01-31，並按「發布」。目前輸入內容會保留。";
	}
	if(code.includes("unavailable")||code.includes("network")){
		return "目前無法連接雲端，請檢查網路後重試。輸入內容會保留。";
	}
	return "儲存失敗："+(error?.message||String(error))+"。請確認 Firebase 設定與網路連線。";
}
function closeEditor(){editor.classList.add("hide");selectedId=null;el("event-form").reset();clearFormFeedback()}
el("cancel").addEventListener("click",closeEditor);
el("refresh").addEventListener("click",()=>location.reload());
el("mobile-refresh").addEventListener("click",()=>location.reload());
function status(s){el("sync-status").textContent=s}
function errorText(e){status("操作失敗："+(e?.message||String(e)))}
async function boot(){
const config=window.SEOUL_FIREBASE_CONFIG;
if(!config?.apiKey||!config?.projectId){render();return}
try{const app=initializeApp(config);db=getFirestore(app);el("config-notice").classList.add("hide");status("雲端連線中…");
unsubscribe=onSnapshot(query(collection(db,"shared-itinerary-2027"),orderBy("date")),snapshot=>{
	// Only server-confirmed snapshots replace the last trustworthy offline copy.
	if(!snapshot.metadata.fromCache){
		items=snapshot.docs.map(d=>({id:d.id,...d.data()})).filter(e=>dates.includes(e.date));
		serverAvailable=true;
		saveItineraryLocally();
	}else{
		serverAvailable=false;
	}
	updateConnectionUI();
},error=>{
	serverAvailable=false;
	updateConnectionUI();
	if(navigator.onLine)errorText(error);
});
}catch(e){errorText(e)}
}
el("event-form").addEventListener("submit",async ev=>{
	ev.preventDefault();
	clearFormFeedback();
	if(!enabled||!db||!navigator.onLine){
		showFormFeedback("尚未連線到 Firebase，無法儲存。請重新整理並確認連線狀態。");
		return;
	}
	const mode=el("time-mode").value;
	const selectedTime=el("time").value;
	const title=el("title").value.trim();
	if(!title){
		showFormFeedback("請先填寫事項名稱。");
		el("title").focus();
		return;
	}
	if(mode==="fixed"&&!/^([01]\d|2[0-3]):[0-5]\d$/.test(selectedTime)){
		showFormFeedback("選擇「指定時間」時，請填寫有效的開始時間。");
		el("time").focus();
		return;
	}
	if(!dates.includes(dateInput.value)){
		showFormFeedback("日期資料不正確，請重新選擇行事曆日期。");
		return;
	}
	const payload={
		date:dateInput.value,
		time:mode==="fixed"?selectedTime:"",
		title:categoryIcon(document.querySelector('input[name="event-category"]:checked')?.value||"other")+" "+plainEventTitle(title),
		notes:el("notes").value.trim(),
		updatedAt:serverTimestamp()
	};
	const saveButton=el("save");
	saveButton.disabled=true;
	saveButton.textContent="儲存中…";
	showFormFeedback("正在將行程儲存到 Firebase，請勿重複點擊。","pending");
	let warningTimer=setTimeout(()=>{
		showFormFeedback("雲端回應較慢，仍在等待儲存結果。請確認網路連線；若持續沒有結果，可重新整理後檢查事項是否已同步，避免重複新增。","pending");
	},8000);
	try{
		if(selectedId){
			await updateDoc(doc(db,"shared-itinerary-2027",selectedId),payload);
		}else{
			await addDoc(collection(db,"shared-itinerary-2027"),payload);
		}
		closeEditor();
		status("已儲存，其他人將同步看到變更");
	}catch(e){
		errorText(e);
		showFormFeedback(saveErrorMessage(e));
	}finally{
		clearTimeout(warningTimer);
		saveButton.disabled=false;
		saveButton.textContent="儲存到共用行事曆";
	}
});
el("delete").addEventListener("click",async()=>{if(!selectedId||!enabled||!navigator.onLine||!confirm("確定刪除這個共同行程？"))return;try{await deleteDoc(doc(db,"shared-itinerary-2027",selectedId));closeEditor()}catch(e){errorText(e)}});
render();
updateConnectionUI();
boot();
if("serviceWorker" in navigator){
	window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(e=>console.warn("離線模式註冊失敗",e)));
}
</script>
