<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>2027 春節旅遊行事曆</title>
<style>
:root{--bg:#f5f5f1;--ink:#21353c;--muted:#64727a;--border:#d8e0e1;--blue:#d1e1f7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.5}header{background:#1d353d;color:white;padding:28px max(18px,calc((100vw - 1120px)/2))}header a{color:#cde0e8}header h1{margin:8px 0}header p{margin:0;color:#d1dddf}main{max-width:1120px;margin:auto;padding:22px 16px 50px}button,input,textarea{font:inherit}button{border:1px solid #b8c9cd;border-radius:8px;background:#fff;padding:8px 11px;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#244853;border-color:#244853;color:#fff}.toolbar,.editor,.notice{background:white;border:1px solid var(--border);border-radius:14px;padding:15px;margin-bottom:16px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.status{font-size:13px;color:var(--muted)}.legend{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.calendar-wrap{overflow-x:auto;border:2px solid #1d3039;background:white}.calendar{display:grid;grid-template-columns:repeat(7,minmax(135px,1fr));min-width:945px}.day{min-height:240px;border-right:1px solid #273b43}.day:nth-child(7n){border-right:0}.day:nth-child(-n+7){border-bottom:1px solid #273b43}.day-head{background:var(--blue);border-bottom:1px solid #273b43;padding:9px;font-weight:750}.holiday{color:#c82323}.day-items{padding:8px;display:flex;flex-direction:column;gap:8px}.event{padding:9px;border-radius:8px;border:1px solid #bcd9df;background:#eaf5f7;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere}.event small{display:block;color:#556b74}.add{margin-top:10px;width:100%;border-style:dashed;font-size:13px}.hint{font-size:13px;color:var(--muted)}.editor{margin-top:16px}.editor h2{margin:0 0 12px;font-size:19px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fields label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:650}.fields input,.fields textarea,.fields select{width:100%;border:1px solid #b8c9cd;border-radius:8px;padding:10px;background:#fff}.fields input[readonly]{background:#eef2f2;color:#36505a;cursor:default}.full{grid-column:span 2}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.danger{color:#b52828}.notice{border-left:5px solid #daa03c}.hide{display:none}
.mobile-calendar{display:none}
@media(max-width:700px){
	header{padding:22px 16px}
	header h1{font-size:25px;line-height:1.3}
	main{padding:14px 12px 35px}
	.toolbar{display:none}
	.calendar-wrap{display:none}
	.mobile-calendar{display:block}
	.mobile-overview,.mobile-detail{background:#fff;border:1px solid var(--border);border-radius:15px;padding:13px;margin-bottom:14px;box-shadow:0 3px 12px #152f3409}
	.mobile-overview-header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
	.mobile-overview h2{font-size:16px;margin:0}
	.mobile-refresh-row{display:flex;align-items:center;flex-shrink:0}
	.mobile-refresh{font-size:13px;border:1px solid #bdc9ca;padding:8px 12px;background:#fff}
	.mobile-weekdays,.mobile-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
	.mobile-weekdays{margin-bottom:5px}
	.mobile-weekdays span{text-align:center;font-size:12px;color:var(--muted)}
	.mobile-weekdays .weekend{color:#ba3434}
	.mobile-days button{position:relative;min-width:0;height:51px;border:0;background:#f1f4f5;border-radius:9px;padding:5px 0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1px;font-size:14px;font-weight:700}
	.mobile-days button.weekend{color:#ad3535}
	.mobile-days button.selected{background:#244853;color:#fff}
	.mobile-days button .dot{width:5px;height:5px;border-radius:100%;background:#2f9e79}
	.mobile-days button.selected .dot{background:#b7e8d3}
	.mobile-days button .dot.empty{visibility:hidden}
	.mobile-days button .mini{font-size:9px;font-weight:500;line-height:1}
	.mobile-detail-header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
	.mobile-detail h2{font-size:19px;margin:0}
	.mobile-detail .holiday-note{font-size:12px;color:#b23838}
	.mobile-detail .empty-note{padding:18px 0;text-align:center;color:var(--muted);font-size:14px}
	.mobile-detail .mobile-event{display:block;width:100%;border:1px solid #c6e0e4;background:#eff8f9;padding:12px;border-radius:10px;text-align:left;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}
	.mobile-detail .mobile-event strong{font-size:15px}
	.mobile-detail .mobile-event .event-time{font-size:13px;color:#366d78;display:block;margin-bottom:4px}
	.mobile-detail .mobile-event .event-notes{font-size:13px;color:var(--muted);display:block;margin-top:6px}
	.mobile-detail .mobile-add{flex-shrink:0;margin:0;border:1px dashed #91aab0;background:white;color:#244853;padding:8px 10px;font-size:13px;font-weight:700}
	.mobile-detail .mobile-add:disabled{color:var(--muted)}
	.fields{grid-template-columns:1fr}
	.full{grid-column:span 1}
	.editor{scroll-margin-top:14px}
}
</style></head><body>
<header><a href="./">← 返回景點介紹</a><h1>2027 春節旅遊行事曆</h1><p>2027/1/31～2/13｜兩週行程規劃</p></header>
<main>
<div id="config-notice" class="notice"><strong>多人同步尚未啟用</strong><div class="hint">行事曆已建立。請先設定 Firebase 專案與 Firestore 規則才能多人共用；設定前無法儲存。啟用免登入共用後，任何取得網址的人都可能閱讀或修改行程，請勿填入個資或訂位編號。</div></div>
<div class="toolbar"><div><strong>行程事項</strong><div class="status" id="sync-status" role="status">等待雲端設定</div></div><div class="legend"><span class="hint">兩週共 14 天 · 星期日開始 · 初始無事項</span><button id="refresh" type="button">重新整理</button></div></div>
<div class="calendar-wrap"><div class="calendar" id="calendar" aria-label="2027 年一月三十一日至二月十三日旅遊行事曆"></div></div>
<div class="mobile-calendar" id="mobile-calendar">
	<section class="mobile-overview" aria-label="選擇行程日期">
		<div class="mobile-overview-header"><h2>兩週日期總覽</h2><div class="mobile-refresh-row"><button type="button" class="mobile-refresh" id="mobile-refresh">↻ 重新整理</button></div></div>
		<div class="mobile-weekdays" aria-hidden="true"><span class="weekend">日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span class="weekend">六</span></div>
		<div class="mobile-days" id="mobile-days"></div>
	</section>
	<section class="mobile-detail" aria-live="polite">
		<div class="mobile-detail-header"><h2 id="mobile-date-heading"></h2><button type="button" class="mobile-add" id="mobile-add">＋ 新增事項</button></div>
		<div id="mobile-events"></div>
	</section>
</div>
<section class="editor hide" id="editor"><h2 id="editor-title">新增事項</h2><form id="event-form"><div class="fields"><label>日期（固定）<input id="date-display" type="text" readonly aria-label="所選日期，不可修改"><select id="date" class="hide" tabindex="-1" aria-hidden="true"></select></label><label>時間（選填）<input type="time" id="time"></label><label class="full">事項名稱<input id="title" maxlength="120" required placeholder="例如：集合、用餐、活動"></label><label class="full">備註（選填）<textarea id="notes" rows="3" maxlength="1000"></textarea></label></div><div class="actions"><button class="primary" id="save" type="submit">儲存到共用行事曆</button><button id="cancel" type="button">取消</button><button class="danger hide" id="delete" type="button">刪除事項</button></div></form></section>
<p class="hint">1/31～2/13 每一天都可以新增、修改及刪除行程。</p>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {getFirestore,collection,onSnapshot,addDoc,updateDoc,deleteDoc,doc,serverTimestamp,query,orderBy} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const dates=Array.from({length:14},(_,i)=>{const d=new Date(2027,0,31+i);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")});
const weekdays=["日","一","二","三","四","五","六"];
const lunar={"2027-02-04":"小年夜","2027-02-05":"除夕","2027-02-06":"初一","2027-02-07":"初二","2027-02-08":"初三","2027-02-09":"初四","2027-02-10":"初五","2027-02-11":"開工"};
const names=dates.map(date=>{const [y,m,d]=date.split("-").map(Number);const label=m+"/"+d+"（"+weekdays[new Date(y,m-1,d).getDay()]+"）";return label+(lunar[date]?" "+lunar[date]:"")});
const el=id=>document.getElementById(id),calendar=el("calendar"),editor=el("editor");
const dateInput=el("date");for(let i=0;i<dates.length;i++){let opt=document.createElement("option");opt.value=dates[i];opt.textContent=names[i];dateInput.append(opt);}
let items=[],db=null,enabled=false,selectedId=null,unsubscribe=null,activeDate="2027-02-03";
function render(){calendar.replaceChildren();dates.forEach((date,i)=>{const day=document.createElement("section");day.className="day";const head=document.createElement("div");head.className="day-head"+((i%7===0||i%7===6||lunar[date])?" holiday":"");head.textContent=names[i];const list=document.createElement("div");list.className="day-items";items.filter(e=>e.date===date).sort((a,b)=>(a.time||"").localeCompare(b.time||"")).forEach(e=>{const btn=document.createElement("button");btn.type="button";btn.className="event";const strong=document.createElement("strong");strong.textContent=(e.time?e.time+" ":"")+e.title;btn.append(strong);if(e.notes){const note=document.createElement("small");note.textContent=e.notes;btn.append(note)}btn.addEventListener("click",()=>openEditor(date,e));list.append(btn)});const add=document.createElement("button");add.type="button";add.className="add";add.textContent="＋ 新增事項";add.disabled=!enabled;add.addEventListener("click",()=>openEditor(date));list.append(add);day.append(head,list);calendar.append(day)});renderMobile()}

function renderMobile(){
	const daysEl=el("mobile-days");
	const eventsEl=el("mobile-events");
	daysEl.replaceChildren();
	eventsEl.replaceChildren();
	dates.forEach((date,i)=>{
		const button=document.createElement("button");
		button.type="button";
		button.className=(i%7===0||i%7===6||lunar[date]?"weekend ":"")+(date===activeDate?"selected":"");
		const num=document.createElement("span");
		num.textContent=String(Number(date.slice(-2)));
		const dot=document.createElement("span");
		dot.className="dot"+(items.some(item=>item.date===date)?"":" empty");
		button.append(num,dot);
		button.setAttribute("aria-label",names[i]+(items.some(item=>item.date===date)?"，有行程":"，無行程"));
		button.setAttribute("aria-pressed",String(date===activeDate));
		button.addEventListener("click",()=>{activeDate=date;renderMobile()});
		daysEl.append(button);
	});
	const dayIndex=dates.indexOf(activeDate);
	el("mobile-date-heading").textContent=names[dayIndex]||"";
	const todayItems=items.filter(e=>e.date===activeDate).sort((a,b)=>(a.time||"").localeCompare(b.time||""));
	if(!todayItems.length){
		const empty=document.createElement("div");
		empty.className="empty-note";
		empty.textContent="尚未安排事項";
		eventsEl.append(empty);
	}else{
		todayItems.forEach(e=>{
			const b=document.createElement("button");
			b.type="button";
			b.className="mobile-event";
			if(e.time){const t=document.createElement("span");t.className="event-time";t.textContent=e.time;b.append(t)}
			const title=document.createElement("strong");title.textContent=e.title;b.append(title);
			if(e.notes){const note=document.createElement("span");note.className="event-notes";note.textContent=e.notes;b.append(note)}
			b.addEventListener("click",()=>openEditor(activeDate,e));
			eventsEl.append(b);
		});
	}
	const add=el("mobile-add");
	add.disabled=!enabled;
	add.textContent="＋ 新增事項";
}
el("mobile-add").addEventListener("click",()=>openEditor(activeDate));
function openEditor(date,e=null){if(!enabled||!dates.includes(date))return;selectedId=e?.id||null;dateInput.value=date;el("date-display").value=names[dates.indexOf(date)]||date;el("time").value=e?.time||"";el("title").value=e?.title||"";el("notes").value=e?.notes||"";el("editor-title").textContent=e?"編輯事項":"新增事項";el("delete").classList.toggle("hide",!e);editor.classList.remove("hide");editor.scrollIntoView({behavior:"smooth",block:"nearest"})}
function closeEditor(){editor.classList.add("hide");selectedId=null;el("event-form").reset()}
el("cancel").addEventListener("click",closeEditor);
el("refresh").addEventListener("click",()=>location.reload());
el("mobile-refresh").addEventListener("click",()=>location.reload());
function status(s){el("sync-status").textContent=s}
function errorText(e){status("操作失敗："+(e?.message||String(e)))}
async function boot(){
const config=window.SEOUL_FIREBASE_CONFIG;
if(!config?.apiKey||!config?.projectId){render();return}
try{const app=initializeApp(config);db=getFirestore(app);el("config-notice").classList.add("hide");status("雲端連線中…");
unsubscribe=onSnapshot(query(collection(db,"shared-itinerary-2027"),orderBy("date")),snapshot=>{items=snapshot.docs.map(d=>({id:d.id,...d.data()})).filter(e=>dates.includes(e.date));enabled=true;status("已同步，免登入即可新增、修改及刪除");render()},errorText);
}catch(e){errorText(e)}
}
el("event-form").addEventListener("submit",async ev=>{ev.preventDefault();if(!enabled||!db)return;const payload={date:dateInput.value,time:el("time").value,title:el("title").value.trim(),notes:el("notes").value.trim(),updatedAt:serverTimestamp()};if(!dates.includes(payload.date)||!payload.title)return;el("save").disabled=true;try{if(selectedId)await updateDoc(doc(db,"shared-itinerary-2027",selectedId),payload);else await addDoc(collection(db,"shared-itinerary-2027"),payload);closeEditor();status("已儲存，其他人將同步看到變更")}catch(e){errorText(e)}finally{el("save").disabled=false}});
el("delete").addEventListener("click",async()=>{if(!selectedId||!enabled||!confirm("確定刪除這個共同行程？"))return;try{await deleteDoc(doc(db,"shared-itinerary-2027",selectedId));closeEditor()}catch(e){errorText(e)}});
render();boot();
</script>
<script src="./calendar-config.js"></script>
</body></html>
